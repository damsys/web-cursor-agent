# HTTP の待受アドレス (セットアップ / TLS 未使用時の本体)。既定ポート 8787。
# 0.0.0.0 は IPv4 と IPv6 の両方で待つ。
# WSL2 では Windows の LAN アドレスには出ない。LAN へ出す手順は README を参照する。
listen: "0.0.0.0:8787"

# ユーザー定義。user upsert が作成する。
users_file: "users.yaml"

# ユーザーごとの Cursor 認証とチャット履歴を置くディレクトリ。
state_dir: "var"

# Cursor CLI のコマンド名または絶対パス。
agent_command: "agent"

# 画面ファイルのあるディレクトリ。static と dist/vendor をここから配信する。
web_dir: "web"

# サーバの NIC と同一サブネット、loopback に加えて許可する接続元。
allow_cidrs: []

# 接続元 MAC を確認する。WSL2 の NAT ではクライアントの MAC を観測できないため false にする。
mac_check: true

# WebSocket 切断後に agent を残す時間。モバイルのスリープ復帰などに使う。既定は 30m。
detach_grace: 30m

# 対話ターン 3, 10, 20, 以降 10 ごとでセッション名を自動更新する。
# agent -p (ask) で日本語名を生成し、idle 時に /rename する。既定は有効。
auto_rename:
  enabled: true

# 家庭内 HTTPS (iOS のマイク / Speech API 用)。未設定なら HTTP のみ。
# 生成: bin/web-cursor-agent tls init --config config.yaml --hosts wca.lan
# HTTPS は tls.listen (未指定時は listen と同じホストでポート 8788)。
# 証明書パスは config.yaml からの相対パスでよい (users_file などと同じ)。
# tls:
#   listen: "0.0.0.0:8788"
#   cert_file: "var/tls/server.crt"
#   key_file: "var/tls/server.key"
#   ca_file: "var/tls/ca.crt"
#   public_host: "wca.lan"

projects:
  - id: sample
    name: sample
    path: /path/to/project
